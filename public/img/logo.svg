<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Demars International">
  <defs>
    <linearGradient id="logoNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#051326"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE77D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0B2545"/>
  <!-- Stylized D contour -->
  <path d="M28 24 h32 c26 0 44 18 44 40 s-18 40 -44 40 h-32 z" fill="none" stroke="#2563eb" stroke-width="8"/>
  <!-- Globe inner sphere -->
  <circle cx="62" cy="64" r="24" fill="#0284c7" stroke="#ffffff" stroke-width="2.5" opacity="0.95"/>
  <ellipse cx="62" cy="64" rx="24" ry="10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
  <line x1="38" y1="64" x2="86" y2="64" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
  <line x1="62" y1="40" x2="62" y2="88" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
  <!-- Gold Orbital Swoosh -->
  <path d="M36 72 C44 46, 88 42, 98 52 C106 58, 88 84, 56 82 C42 80, 32 76, 28 72" fill="none" stroke="url(#logoGold)" stroke-width="5" stroke-linecap="round"/>
  <!-- Flight arrow -->
  <polygon points="100,44 110,48 98,54 102,48" fill="#FCE77D"/>
  <!-- Cargo vessel bow accent -->
  <path d="M24 88 L48 88 L42 98 L28 98 Z" fill="#051326"/>
  <rect x="28" y="82" width="6" height="6" fill="#D4AF37"/>
  <rect x="36" y="82" width="6" height="6" fill="#FCE77D"/>
</svg>
