  <line x1="31" y1="20" x2="31" y2="44" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
  <!-- Gold Orbital Swoosh -->
  <path d="M18 36 C22 23, 44 21, 49 26 C53 29, 44 42, 28 41 C21 40, 16 38, 14 36" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
